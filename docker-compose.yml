services:
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - judge-service
    restart: unless-stopped

  judge-service:
    build: ./judge-service
    environment:
      - ORCHESTRATOR_URL=http://orchestrator:8080
    depends_on:
      - orchestrator
    restart: unless-stopped

  orchestrator:
    build: ./orchestrator
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
